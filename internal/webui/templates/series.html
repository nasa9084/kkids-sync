{{define "content"}}
<p class="note">全{{len .Books}}巻・{{.OnShelfCount}}巻が本棚に</p>
<div class="actions">
  {{if .Missing}}
  <form method="post" action="/series/{{.SeriesID}}/shelf-all">
    <button class="wide-btn" type="submit" style="width:100%">このシリーズを全部本棚に入れる(あと{{.Missing}}冊)</button>
  </form>
  {{end}}
  {{if and .NextThree (gt .Missing (len .NextThree))}}
  <form method="post" action="/series/{{.SeriesID}}/shelf">
    {{range .NextThree}}<input type="hidden" name="asin" value="{{.}}">{{end}}
    <button class="wide-btn outline" type="submit" style="width:100%">次の{{len .NextThree}}冊だけ入れる</button>
  </form>
  {{end}}
</div>
<h2>巻の一覧</h2>
{{range .Books}}{{template "series-book" .}}{{end}}
{{end}}
